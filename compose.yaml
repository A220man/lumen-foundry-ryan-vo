version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumen-foundry-backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/lumen.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=lumen-foundry
      - KEYCLOAK_CLIENT_ID=lumen-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/lumen-foundry/.well-known/openid-configuration
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=
      - LLM_BASE_URL=
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEMO_MODE=true
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
    volumes:
      - lumen-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumen-foundry-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lumen-foundry-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  lumen-data:
  keycloak-data:

networks:
  default:
    name: lumen-foundry-network
