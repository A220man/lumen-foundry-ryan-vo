name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: lumen-foundry-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: lumen-foundry-frontend:test
          load: true

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          REQUIRED_FILES=(
            "portfolio.json"
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "pyproject.toml"
            ".gitignore"
            ".env.example"
            "compose.yaml"
            "backend/requirements.txt"
            "backend/Dockerfile"
            "backend/app/main.py"
            "frontend/Dockerfile"
            "frontend/package.json"
            "frontend/package-lock.json"
            ".github/workflows/ci.yml"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate portfolio.json
        run: |
          python3 -c "
          import json
          with open('portfolio.json') as f:
            data = json.load(f)
          required = ['schema_version', 'name', 'owner', 'email', 'domain', 'workflows', 'auth', 'llm_providers']
          for field in required:
            assert field in data, f'Missing field: {field}'
          assert len(data['workflows']) >= 3, 'At least 3 workflows required'
          assert data['schema_version'] == 1
          print('portfolio.json valid')
          "
